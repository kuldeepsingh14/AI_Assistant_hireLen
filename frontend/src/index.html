<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HireLens — Resume-grounded AI assistant</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An AI assistant that answers questions about one candidate straight from their resume, and scores any job description against it.">
  <!-- SVG first for crisp scaling; the PNG covers browsers that ignore it. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Tints mobile browser chrome to match the app. -->
  <meta name="theme-color" content="#5546e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d16" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Resolve the theme before first paint, otherwise the page flashes the
    // wrong palette while Angular boots. Stored choice wins; otherwise follow
    // the device. This is the only mechanism needed - the app requires JS.
    (function () {
      var mode = 'dark';
      try {
        var saved = localStorage.getItem('hirelens.theme');
        mode =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
      } catch (e) {
        /* private browsing or no matchMedia - fall through to the default */
      }
      document.documentElement.setAttribute('data-theme', mode);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
